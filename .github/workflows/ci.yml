name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: true
      - name: Install Staticcheck
        run: |
          mkdir -p "$RUNNER_TEMP/jejak-tools"
          GOBIN="$RUNNER_TEMP/jejak-tools" go install honnef.co/go/tools/cmd/staticcheck@v0.8.1
      - name: Run Staticcheck
        run: |
          "$RUNNER_TEMP/jejak-tools/staticcheck" ./...
      - name: Run unit and integration tests
        run: go test ./...
      - name: Run race tests
        run: go test -race ./...
      - name: Run vet
        run: go vet ./...
      - name: Build CLI
        run: go build ./cmd/jejak
      - name: Run benchmark smoke
        run: go test ./tests/benchmarks -run '^$' -bench . -benchmem
